name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: ALSA headers for the player's audio output
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check standalone camera bridge and locked dependency graph
        run: cargo check --locked --manifest-path crates/fvid-camera-ffi/Cargo.toml
      # The ffmpeg_compare bench needs ffmpeg on PATH, so benches are left out.
      - name: Test owned media codecs without libav
        # Cargo/build tools keep their normal PATH; test executables cannot find external programs.
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /usr/bin/env PATH=/fvid/no-external-programs
          FVID_FFMPEG_PREFIX: /fvid/no-ffmpeg
        run: cargo test --locked --manifest-path crates/fvid-media/Cargo.toml --no-default-features
      - name: Test default features without external programs
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /usr/bin/env PATH=/fvid/no-external-programs
          FVID_FFMPEG_PREFIX: /fvid/no-ffmpeg
        run: cargo test --lib --bins --tests
      - name: Test CPU-only
        # Cargo/build tools keep their normal PATH; test executables cannot find external programs.
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /usr/bin/env PATH=/fvid/no-external-programs
          FVID_FFMPEG_PREFIX: /fvid/no-ffmpeg
        run: cargo test --no-default-features
      - name: Test player without external programs
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /usr/bin/env PATH=/fvid/no-external-programs
          FVID_FFMPEG_PREFIX: /fvid/no-ffmpeg
        run: cargo test --no-default-features --features player --lib --bins --tests
      - name: Test production media without external programs
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /usr/bin/env PATH=/fvid/no-external-programs
          FVID_FFMPEG_PREFIX: /fvid/no-ffmpeg
        run: cargo test --locked --no-default-features --features media --lib --bins --tests
      - name: Test owned NVDEC AVC preparation without external programs
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: /usr/bin/env PATH=/fvid/no-external-programs
          FVID_FFMPEG_PREFIX: /fvid/no-ffmpeg
        run: |
          cargo test --locked --manifest-path crates/fvid-media/Cargo.toml --no-default-features --features native-cuda --lib owned_video_timeline
          cargo test --locked --manifest-path crates/fvid-media/Cargo.toml --no-default-features --features native-cuda --lib owned_nvdec_
          cargo test --locked --manifest-path crates/fvid-media/Cargo.toml --no-default-features --features native-cuda --lib owned_nvenc_movie
          cargo test --locked --manifest-path crates/fvid-media/Cargo.toml --no-default-features --features native-cuda --lib owned_avc_annexb
      - name: Guard native graphs and ordinary tests against FFmpeg
        run: |
          python3 scripts/test_native_dependency_policy.py
          python3 scripts/test_gpu_reference_policy.py
          python3 scripts/test_cuda_qualification.py
          python3 scripts/test_hw_cuda_reference_policy.py
          python3 scripts/test_media_reference_policy.py
          python3 scripts/test_klite_reference_policy.py
          python3 scripts/check_native_dependencies.py --offline
