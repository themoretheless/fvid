[package]
name = "fvid-media"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "FVid media operations with an optional legacy libav backend"

[dependencies]
fvid-media-info = { path = "../fvid-media-info" }
fvid-control = { path = "../fvid-control" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
cpal = { version = "0.15", optional = true }
fvid-cuda = { path = "../fvid-cuda", optional = true }
fvid-cpu = { path = "../fvid-cpu" }
eframe = { version = "0.36", optional = true }
rfd = { version = "0.17.2", optional = true }

[features]
default = []
legacy-ffmpeg = ["dep:bindgen"]
cuda-hw = ["legacy-ffmpeg", "dep:fvid-cuda"]
# Windowed playback: pulls the egui/eframe window, cpal audio output, and the
# rfd file dialogs. Off, the crate is a pure decode/edit library.
player = [ "dep:eframe", "dep:rfd", "dep:cpal"]

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }

[[bench]]
name = "ffmpeg_audio_reference"
harness = false

[[bench]]
name = "ffmpeg_time_reference"
harness = false
required-features = ["legacy-ffmpeg"]

[[bench]]
name = "ffmpeg_true_peak_reference"
harness = false

