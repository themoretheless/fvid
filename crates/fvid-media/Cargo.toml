[package]
name = "fvid-media"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Optional native libavformat adapter with checked editing contracts"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
cpal = "0.15"
fvid-cuda = { path = "../fvid-cuda", optional = true }
fvid-cpu = { path = "../fvid-cpu" }
eframe = "0.36"
rfd = "0.17.2"

[features]
default = []
cuda-hw = ["dep:fvid-cuda"]

[build-dependencies]
bindgen = "0.72.1"
