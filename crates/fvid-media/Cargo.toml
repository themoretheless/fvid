[package]
name = "fvid-media"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Optional native libavformat adapter with checked editing contracts"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
cpal = { version = "0.15", optional = true }
fvid-cuda = { path = "../fvid-cuda", optional = true }
fvid-cpu = { path = "../fvid-cpu" }
eframe = { version = "0.36", optional = true }
rfd = { version = "0.17.2", optional = true }

[features]
default = []
cuda-hw = ["dep:fvid-cuda"]
# Windowed playback: pulls the egui/eframe window, cpal audio output, and the
# rfd file dialogs. Off, the crate is a pure decode/edit library.
player = ["dep:eframe", "dep:rfd", "dep:cpal"]

[build-dependencies]
bindgen = "0.72.1"
