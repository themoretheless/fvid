[package]
name = "fvid-media"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Owned FVid media operations without FFmpeg"

[dependencies]
fvid-opus = { path = "../fvid-opus" }
fvid-codecs = { path = "../fvid-codecs" }
ab_glyph = "0.2.32"
epaint_default_fonts = "0.36.2"
fvid-media-info = { path = "../fvid-media-info" }
fvid-control = { path = "../fvid-control" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
miniz_oxide = { version = "=0.8.9", default-features = false }
fvid-cuda = { path = "../fvid-cuda", optional = true }
fvid-cpu = { path = "../fvid-cpu" }

reqwest = { version = "=0.12.28", optional = true, default-features = false, features = ["blocking", "rustls-tls"] }

[features]
default = []
http-input = ["dep:reqwest"]
# Compatibility flag for the explicit libavutil timestamp benchmark only.
# It never selects another implementation of the library API.
legacy-ffmpeg = []
native-cuda = ["dep:fvid-cuda"]
# Production CUDA is owned; legacy libav is opt-in for comparison benchmarks.
cuda-hw = ["native-cuda"]
# Codec playback capabilities (windowed UI and audio devices belong to the root fvid crate).
player = ["fvid-codecs/player"]

[[bench]]
name = "ffmpeg_audio_reference"
harness = false

[[bench]]
name = "ffmpeg_time_reference"
harness = false
required-features = ["legacy-ffmpeg"]

