[package]
name = "fvid-cuda"
version = "0.1.0"
edition = "2024"
description = "Optional CUDA compute adapter for Fvid planar byte transforms"
license = "MIT"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
# CUDA 13 bindings load nvrtc64_130_0.dll / libnvrtc.so.13 (required for Blackwell / sm_120).
libloading = "=0.9.0"
cudarc = { version = "=0.19.9", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13000"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
