[workspace]
members = [
    ".",
    "crates/fvid-codecs",
    "crates/fvid-control",
    "crates/fvid-cpu",
    "crates/fvid-cuda",
    "crates/fvid-media",
    "crates/fvid-media-info",
    "crates/fvid-opus",
    "crates/fvid-platform",
    "crates/fvid-vt",
]
exclude = ["crates/fvid-camera-ffi"]
default-members = ["."]

[package]
name = "fvid"
default-run = "fvid"
version = "0.2.1"
edition = "2024"
description = "Bounded, fused planar video processing in safe Rust"
license = "MIT AND MPL-2.0"

# Native software decoding must keep up with playback in the default player
# build too. Preserve dev diagnostics while optimizing pixel/entropy hot loops.
[profile.dev.package.fvid-codecs]
opt-level = 3

[profile.dev.package.fvid-cpu]
opt-level = 3

[profile.dev.package.fvid-opus]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# DSP/SIMD filter tables and codec math use verbatim spec constants, grouped loops,
# and fixed-arity helpers; preserve them rather than rewriting every table.
approx_constant = "allow"
blocks_in_conditions = "allow"
bool_assert_comparison = "allow"
chunks_exact_to_as_chunks = "allow"
clone_on_copy = "allow"
cloned_ref_to_slice_refs = "allow"
cmp_owned = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
default_constructed_unit_structs = "allow"
doc_lazy_continuation = "allow"
double_comparisons = "allow"
double_ended_iterator_last = "allow"
drop_non_drop = "allow"
duplicated_attributes = "allow"
erasing_op = "allow"
err_expect = "allow"
excessive_precision = "allow"
expect_fun_call = "allow"
explicit_counter_loop = "allow"
field_reassign_with_default = "allow"
identity_op = "allow"
if_same_then_else = "allow"
inconsistent_digit_grouping = "allow"
int_plus_one = "allow"
items_after_test_module = "allow"
large_enum_variant = "allow"
len_zero = "allow"
let_and_return = "allow"
manual_checked_ops = "allow"
manual_clamp = "allow"
manual_contains = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
manual_pattern_char_comparison = "allow"
manual_range_contains = "allow"
manual_range_patterns = "allow"
manual_repeat_n = "allow"
match_like_matches_macro = "allow"
module_inception = "allow"
modulo_one = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
needless_late_init = "allow"
needless_lifetimes = "allow"
needless_range_loop = "allow"
needless_return = "allow"
needless_update = "allow"
neg_cmp_op_on_partial_ord = "allow"
new_without_default = "allow"
op_ref = "allow"
option_as_ref_deref = "allow"
possible_missing_else = "allow"
precedence = "allow"
redundant_closure = "allow"
redundant_field_names = "allow"
redundant_guards = "allow"
replace_box = "allow"
should_implement_trait = "allow"
single_element_loop = "allow"
single_match = "allow"
single_range_in_vec_init = "allow"
suspicious_assignment_formatting = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_cast = "allow"
unnecessary_fallible_conversions = "allow"
unnecessary_lazy_evaluations = "allow"
unnecessary_literal_unwrap = "allow"
unnecessary_mut_passed = "allow"
unnecessary_unwrap = "allow"
unusual_byte_groupings = "allow"
upper_case_acronyms = "allow"
useless_conversion = "allow"
useless_vec = "allow"
while_immutable_condition = "allow"

[lints]
workspace = true

[features]
default = ["gpu", "cuda"]
player = ["fvid-codecs/player", "dep:fvid-opus", "dep:pollster", "dep:naga", "dep:eframe", "dep:rfd", "dep:fvid-platform", "dep:cpal", "dep:symphonia", "videotoolbox", "fvid-vt?/metal", "fvid-media/player", "fvid-media/http-input"]
# Hardware decode and H.264/HEVC encode through VideoToolbox; a no-op off macOS.
videotoolbox = ["dep:fvid-vt", "fvid-vt?/metal"]
cuda = ["dep:fvid-cuda"]
gpu = ["dep:wgpu", "dep:pollster", "dep:naga", "dep:fvid-vt", "fvid-vt?/metal"]
mcp = ["media", "dep:rmcp", "dep:tokio", "dep:axum", "dep:serde"]
media = ["fvid-media/http-input"]
# Owned media + CUDA NVDEC/NVENC (no FFmpeg/libav backend).
media-cuda = ["media", "cuda", "fvid-media/cuda-hw"]
# Local airbug toolkit from themoretheless/airbug@release (err + OTLP).
airbug = ["dep:airbug-err", "dep:airbug-otel"]
# Optional translation layers on Apple platforms (require installed runtimes).
angle = ["gpu", "wgpu/angle"]
vulkan-portability = ["gpu", "wgpu/vulkan-portability"]

[dependencies]
fvid-codecs = { path = "crates/fvid-codecs" }
fvid-opus = { path = "crates/fvid-opus", optional = true }
fvid-media-info = { path = "crates/fvid-media-info" }
fvid-control = { path = "crates/fvid-control" }
fvid-platform = { path = "crates/fvid-platform", optional = true }
eframe = { version = "0.36", optional = true }
rfd = { version = "0.17.2", optional = true }
cpal = { version = "0.15", optional = true }
symphonia = { version = "0.6", optional = true, default-features = false, features = ["opt-simd"] }
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "gles", "wgsl"] }
pollster = { version = "0.4", optional = true }
naga = { version = "=30.0.1", optional = true, features = ["wgsl-in"] }

fvid-cuda = { path = "crates/fvid-cuda", optional = true }
fvid-media = { path = "crates/fvid-media", default-features = false }
fvid-cpu = { path = "crates/fvid-cpu" }
serde_json = "1"

rmcp = { version = "=3.1.2", optional = true, default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "signal", "sync"] }
axum = { version = "0.8", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }

# themoretheless/airbug release branch (publish=false crates → git).
airbug-err = { git = "https://github.com/themoretheless/airbug", branch = "release", optional = true }
airbug-otel = { git = "https://github.com/themoretheless/airbug", branch = "release", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
fvid-vt = { path = "crates/fvid-vt", optional = true }

[dev-dependencies]
# Independent MPEG PCM references are test-only; production dispatch is owned.
symphonia = { version = "0.6", default-features = false, features = ["mp3", "mp2", "mp1"] }
fvid-opus = { path = "crates/fvid-opus" }
pollster = "0.4"
naga = { version = "=30.0.1", features = ["wgsl-in", "glsl-out", "hlsl-out", "spv-out", "msl-out"] }
airbug = { git = "https://github.com/themoretheless/airbug", branch = "release" }
airbug-bench = { git = "https://github.com/themoretheless/airbug", branch = "release", features = ["macros"] }

[[bench]]
name = "ffmpeg_compare"
harness = false

# Both drive the audio pipeline, which only exists with the player feature.
