[package]
name = "fvid"
version = "0.1.0"
edition = "2024"
description = "Bounded, fused planar video processing in safe Rust"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[features]
default = ["gpu", "cuda"]
player = ["dep:eframe", "dep:rfd", "dep:fvid-platform", "dep:cpal", "dep:symphonia", "videotoolbox"]
# Hardware H.264 decoding through Apple VideoToolbox; a no-op off macOS.
videotoolbox = ["dep:fvid-vt"]
cuda = ["dep:fvid-cuda"]
gpu = ["dep:wgpu", "dep:pollster"]
mcp = ["media", "dep:rmcp", "dep:tokio", "dep:axum", "dep:serde"]
media = ["dep:fvid-media", "dep:serde_json"]
# Native media + CUDA NVDEC/NVENC vertical slice (pulls fvid-media/cuda-hw).
media-cuda = ["media", "cuda", "fvid-media/cuda-hw"]
# Local airbug toolkit from themoretheless/airbug@release (err + OTLP).
airbug = ["dep:airbug-err", "dep:airbug-otel"]
# Optional translation layers on Apple platforms (require installed runtimes).
angle = ["gpu", "wgpu/angle"]
vulkan-portability = ["gpu", "wgpu/vulkan-portability"]

[dependencies]
fvid-platform = { path = "crates/fvid-platform", optional = true }
eframe = { version = "0.36", optional = true }
rfd = { version = "0.17.2", optional = true }
cpal = { version = "0.15", optional = true }
symphonia = { version = "0.6", optional = true, features = ["aac", "adpcm", "vorbis", "mp3", "mp2", "flac", "isomp4"] }
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "gles", "wgsl"] }
pollster = { version = "0.4", optional = true }

fvid-cuda = { path = "crates/fvid-cuda", optional = true }
fvid-media = { path = "crates/fvid-media", optional = true }
fvid-cpu = { path = "crates/fvid-cpu" }
serde_json = { version = "1", optional = true }

rmcp = { version = "=3.1.2", optional = true, default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "signal", "sync"] }
axum = { version = "0.8", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }

# themoretheless/airbug release branch (publish=false crates → git).
airbug-err = { git = "https://github.com/themoretheless/airbug", branch = "release", optional = true }
airbug-otel = { git = "https://github.com/themoretheless/airbug", branch = "release", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
fvid-vt = { path = "crates/fvid-vt", optional = true }

[dev-dependencies]
naga = { version = "=30.0.1", features = ["wgsl-in", "glsl-out", "hlsl-out", "spv-out", "msl-out"] }
airbug = { git = "https://github.com/themoretheless/airbug", branch = "release" }
airbug-bench = { git = "https://github.com/themoretheless/airbug", branch = "release", features = ["macros"] }

[[bench]]
name = "ffmpeg_compare"
harness = false

# Both drive the audio pipeline, which only exists with the player feature.
[[example]]
name = "audio_probe"
required-features = ["player"]

[[example]]
name = "av_sync"
required-features = ["player"]
